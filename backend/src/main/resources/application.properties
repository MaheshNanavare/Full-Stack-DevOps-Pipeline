server.port=8080
spring.application.name=backend

# CORS Configuration
cors.allowed.origins=http://localhost,http://localhost:80,http://localhost:3000

# Actuator endpoints
# NOTE: For production use, consider adding Spring Security to protect actuator endpoints
# and restrict management.endpoints.web.exposure.include to specific endpoints only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
